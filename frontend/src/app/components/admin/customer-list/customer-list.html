<div class="container" style="padding-top:24px;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2>Customers</h2>
    <a href="#!/admin" class="btn btn-primary">← Dashboard</a>
  </div>

  <!-- Search -->
  <div class="card" style="margin-bottom:16px;">
    <input type="text"
           ng-model="vm.search"
           placeholder="Search by name or email..."
           style="margin:0;" />
  </div>

  <div ng-if="vm.loading" style="text-align:center;padding:40px;">Loading customers...</div>

  <div class="card" ng-if="!vm.loading">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr ng-repeat="c in vm.customers | filter:vm.search track by c.id">
          <td>{{ c.firstName }} {{ c.lastName }}</td>
          <td>{{ c.email }}</td>
          <td>
            <span ng-style="{ color: c.isActive ? '#28a745' : '#dc3545' }">
              {{ c.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>
            <a ng-href="#!/admin/customers/{{ c.id }}" class="btn btn-primary"
               style="padding:6px 12px;font-size:12px;">
              View
            </a>
          </td>
        </tr>
        <tr ng-if="vm.customers.length === 0">
          <td colspan="4" style="text-align:center;color:#888;">No customers found.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
