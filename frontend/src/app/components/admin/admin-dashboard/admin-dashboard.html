<div class="page">

  <!-- ─── Header ─────────────────────────────────────────────────────── -->
  <div class="page-header">
    <div>
      <p class="page-greeting">Admin Panel</p>
      <h1 class="page-title">Dashboard</h1>
    </div>
  </div>

  <!-- ─── Loading ────────────────────────────────────────────────────── -->
  <div class="state-loading" ng-if="loading">
    <div class="spinner"></div>
    <span>Loading summary…</span>
  </div>

  <!-- ─── Content ────────────────────────────────────────────────────── -->
  <div ng-if="!loading">

    <!-- Stat Cards -->
    <div class="admin-stat-grid">

      <div class="admin-stat-card">
        <div class="admin-stat-icon admin-stat-icon--blue">👥</div>
        <div class="admin-stat-body">
          <span class="admin-stat-label">Total Customers</span>
          <span class="admin-stat-value">{{ summary.totalCustomers }}</span>
        </div>
      </div>

      <div class="admin-stat-card">
        <div class="admin-stat-icon admin-stat-icon--orange">🏦</div>
        <div class="admin-stat-body">
          <span class="admin-stat-label">Total Accounts</span>
          <span class="admin-stat-value">{{ summary.totalAccounts }}</span>
        </div>
      </div>

      <div class="admin-stat-card admin-stat-card--wide">
        <div class="admin-stat-icon admin-stat-icon--green">💰</div>
        <div class="admin-stat-body">
          <span class="admin-stat-label">Total Balance</span>
          <span class="admin-stat-value admin-stat-value--currency">
            {{ summary.totalBalance | currency:'₱' }}
          </span>
        </div>
      </div>

    </div>

    <!-- Quick Navigation -->
    <h2 class="section-title">Quick Navigation</h2>
    <div class="quick-actions">

      <a class="quick-action-card" href="#!/admin/users">
        <span class="quick-action-icon">👤</span>
        <span class="quick-action-label">Users</span>
      </a>

      <a class="quick-action-card" href="#!/admin/transactions">
        <span class="quick-action-icon">&#128339;</span>
        <span class="quick-action-label">Transactions</span>
      </a>

      <a class="quick-action-card" href="#!/admin/requests">
        <span class="quick-action-icon">📄</span>
        <span class="quick-action-label">Requests</span>
      </a>

    </div>

  </div>

</div>
